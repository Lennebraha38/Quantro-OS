# Quantro OS - Windows 11 Birebir Kısayol Haritası (Desktop Shell Hotkeys)
# Masaüstü Kabuğu ve Sistem Genelinde Geçerli Kısayollar

# Win Tuşu Temel Eylemleri
Super_L              = quantro-shell --toggle-start-menu
Super+a              = quantro-shell --toggle-quick-settings
Super+n              = quantro-shell --toggle-notification-center
Super+w              = quantro-shell --toggle-widgets
Super+v              = quantro-clipboard --toggle-history
Super+period         = quantro-clipboard --toggle-emoji-picker
Super+Shift+s        = quantro-snipping-tool --interactive
Super+e              = quantro-filemanager
Super+i              = quantro-settings
Super+l              = loginctl lock-session
Super+Tab            = quantro-shell --toggle-task-view
Ctrl+Shift+Escape    = quantro-taskmanager

# Pencere Tutturma (Snap Layouts) Kısayolları
Super+Left           = quantro-snap --tile-left
Super+Right          = quantro-snap --tile-right
Super+Up             = quantro-snap --maximize
Super+Down           = quantro-snap --minimize
Super+Alt+Left       = quantro-snap --tile-third-left
Super+Alt+Right      = quantro-snap --tile-third-right
