# Quantro OS - RNNoise AI Mikrofon Gurultu Engelleme Boru Hatti
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Quantro AI Gurultu Engelleyici Mikrofon (RNNoise)"
            media.name       = "Quantro AI Gurultu Engelleyici Mikrofon"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = librnnoise_ladspa
                        label  = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" = 50.0
                            "VAD Grace Period (ms)" = 200.0
                            "Retroactive VAD Grace (ms)" = 50.0
                        }
                    }
                ]
            }
            audio.position = [ FL ]
            capture.props = {
                node.name = "capture.rnnoise_source"
                node.passive = true
                audio.rate = 48000
            }
            playback.props = {
                node.name = "rnnoise_source"
                media.class = "Audio/Source"
                audio.rate = 48000
            }
        }
    }
]
