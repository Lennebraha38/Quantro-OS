# Quantro OS - 7.1 Virtual Spatial Surround Audio Sink
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Quantro 7.1 Sanal Uzamsal Ses (Spatial Audio)"
            media.name       = "Quantro 7.1 Spatial Audio Sink"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = matrix
                        label = convolver
                    }
                ]
            }
            audio.position = [ FL, FR, FC, LFE, SL, SR, RL, RR ]
            capture.props = {
                node.name = "spatial.7.1_sink"
                media.class = "Audio/Sink"
                audio.rate = 48000
            }
            playback.props = {
                node.name = "playback.spatial_stereo"
                node.passive = true
                audio.position = [ FL, FR ]
                audio.rate = 48000
            }
        }
    }
]
