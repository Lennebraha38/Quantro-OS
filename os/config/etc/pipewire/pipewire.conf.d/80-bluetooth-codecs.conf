# Quantro OS - Bluetooth Hi-Res Kodek Yapilandirmasi
# LDAC, aptX HD, AAC, LC3 (BLE Audio) Oncelik Siralamasi
bluez5.enable-sbc-xq = true
bluez5.enable-msbc   = true
bluez5.codecs = [ "ldac", "aptx_hd", "aptx", "aac", "lc3", "sbc_xq", "sbc" ]
bluez5.default.rate = 48000
bluez5.default.channels = 2
bluez5.auto-connect = [ "hfp_hf", "a2dp_sink", "hsp_hs", "a2dp_source" ]
bluez5.hw-volume = [ "hfp_hf", "a2dp_sink" ]
