<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Quantro OS / Windows 11 Fluent Typography & ClearType Configuration
  FreeType2 + HarfBuzz + Fontconfig Pixel-Perfect Rendering Rules
-->
<fontconfig>
  <!-- ClearType Alt Piksel İşleme Karşılığı -->
  <match target="font">
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
    <edit mode="assign" name="embeddedbitmap">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Sistem Genelinde Inter Variable & Fluent Değişken Yazı Tipi Tercihleri -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter Variable</family>
      <family>Selawik</family>
      <family>Segoe UI Variable Text</family>
      <family>Noto Color Emoji</family>
      <family>Fluent System Icons</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Inter Variable</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Cascadia Code</family>
      <family>Inter Display</family>
      <family>JetBrains Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Segoe UI Takma Adları Yönlendirmesi -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Segoe UI</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>Inter Variable</string>
    </edit>
  </match>

</fontconfig>
